<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Logistics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        .hub-label { background: #fff; border: 1px solid #333; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .mode-selection-popup { display: flex; gap: 8px; }
        .mode-btn { cursor: pointer; font-size: 20px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="intro-screen" style="text-align: center; padding: 50px;">
        <h1>TRÒ CHƠI LOGISTICS</h1>
        <button id="start-btn" onclick="startGame()" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">BẮT ĐẦU</button>
    </div>
    <div id="map-screen" style="display: none;">
        <div style="padding: 10px; background: #f4f4f4; display: flex; gap: 20px;">
            <div>Chi phí: $<span id="stat-cost">0</span></div>
            <div>Thời gian: <span id="stat-time">0</span> ngày</div>
            <div>CO2: <span id="stat-co2">0</span> kg</div>
            <div>Quãng đường: <span id="stat-distance">0</span> km</div>
            <div>Thời gian còn lại: <span id="timer-panel">10:00</span></div>
        </div>
        
        <div id="map" style="height: 600px; width: 100%;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
